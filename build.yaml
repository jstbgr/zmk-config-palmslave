include:
  # 左手 = セントラル（PCとUSB/BLEで接続する側）。ZMK Studio対応
  - board: nice_nano_v2
    shield: palmslave_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
